# Secret scanning and dependency audit (SEC-16, SEC-11).
name: security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # new advisories appear without code changes
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      # Personal-account repo: no GITLEAKS_LICENSE needed. Findings are never
      # silenced with .gitleaksignore for leaked values; rotate, then purge history (K-07).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as the Dockerfile, ci.yml and bun.lock (BE-27: package.json#packageManager).
          bun-version-file: package.json
      # Also proves bun.lock matches package.json; --ignore-scripts keeps lifecycle scripts off.
      - run: bun install --frozen-lockfile --ignore-scripts
      # No high/critical advisory is deferred (claudedocs/security/audit-deferrals.md), so the
      # gate is high. A new high must be fixed or deferred there with a reason and review date.
      - run: bun audit --audit-level=high
