# Bun test runner scope (T-02): server/API tests only.
# `bun test` (with or without a path) collects tests/server/** here;
# component tests in tests/frontend/** run under Vitest + jsdom instead.
[test]
root = "tests/server"
# CSS Modules under Bun: identity class names, as in Vitest (non-scoped).
preload = ["./tests/frontend/css-arch/bun-css-modules.ts"]
