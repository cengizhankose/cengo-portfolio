version: "3.8"

services:
  # Development service - with hot reload
  app-dev:
    build:
      context: .
      target: development
    container_name: cengo-portfolio-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - portfolio-network
    profiles:
      - development

  # Production service - serves built app
  app-prod:
    build:
      context: .
      target: production
    container_name: cengo-portfolio-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - portfolio-network
    profiles:
      - production

  # Local development database (K-02 = A, BE-04 / SEC-06). Never used by the
  # production image or Out Plane. `bun run db:up` starts it (targeting the
  # service by name enables its profile). Trust auth, no password: the port is
  # published on 127.0.0.1 only and the database holds seed data only.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: portfolio
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 images keep data in a versioned directory under this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - portfolio-network
    profiles:
      - dev

networks:
  portfolio-network:
    driver: bridge

volumes:
  node_modules:
    driver: local
  pgdata: {}
