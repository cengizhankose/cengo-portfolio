# Local only (BE-25): a development database, a hot-reload container and a
# smoke test of the production image. Out Plane never reads this file: it
# builds the Dockerfile (last stage `production`) on every push to main.
#
#   bun run db:up                                  database only (profile `dev`)
#   docker compose --profile development up app-dev    Vite + API with hot reload
#   docker compose --profile production up --build app-prod
#                                                  the production image against `db`
#
# Published ports are bound to 127.0.0.1 (SEC-12): nothing here is meant to be
# reached from the LAN.
services:
  # Development service - with hot reload
  app-dev:
    build:
      context: .
      target: development
    container_name: cengo-portfolio-dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      # SEC-12: Vite binds 127.0.0.1 by default; inside the container it must
      # listen on all interfaces for the published port to reach it.
      - VITE_HOST=0.0.0.0
      # The dev API talks to the compose database (no TLS locally, BE-13).
      - PG_CONNECTION_URL=postgres://portfolio@db:5432/portfolio_dev
      - PG_SSL_MODE=disable
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - portfolio-network
    profiles:
      - development

  # Production image against the compose database (the BE-21 stop-time check
  # and the local smoke test: `curl localhost:3000/api/posts` -> 200). It runs
  # the image's CMD: migrations, then server.ts. Never used by Out Plane.
  app-prod:
    build:
      context: .
      target: production
    container_name: cengo-portfolio-prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PG_CONNECTION_URL=postgres://portfolio@db:5432/portfolio_dev
      # Plaintext is accepted in production mode only for a local host (the
      # compose `db` inside a container); Out Plane keeps verify-full (SEC-22).
      - PG_SSL_MODE=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - portfolio-network
    profiles:
      - production

  # Local development database (K-02 = A, BE-04 / SEC-06). Never used by
  # Out Plane. `bun run db:up` starts it (targeting the service by name
  # enables its profile); the app-dev / app-prod profiles start it as their
  # dependency. Trust auth, no password: the port is published on 127.0.0.1
  # only and the database holds seed data only.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: portfolio
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 images keep data in a versioned directory under this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - portfolio-network
    profiles:
      - dev
      - development
      - production

networks:
  portfolio-network:
    driver: bridge

volumes:
  pgdata: {}
